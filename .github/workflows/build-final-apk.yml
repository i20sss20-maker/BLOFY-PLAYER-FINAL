name: Build BLOFY FINAL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blofy-final-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
    steps:
      - name: Checkout final repo
        uses: actions/checkout@v4

      - name: Checkout v332 source
        uses: actions/checkout@v4
        with:
          repository: i20sss20-maker/BLOFY-PLAYER-2026
          ref: v332-adaptive-playback-ui
          path: source-repo

      - name: Apply v332 only
        working-directory: source-repo
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v332_adaptive.py
          python3 tools/apply_v332_controller_bridge.py
          python3 tools/apply_v332_ui.py
          python3 tools/apply_v332_error_guard.py

      - name: Verify v332 source
        shell: bash
        run: |
          set -euo pipefail
          test -f source-repo/BLOFY-ANDROID-2026/app/build.gradle.kts
          grep -q 'versionCode = 332' source-repo/BLOFY-ANDROID-2026/app/build.gradle.kts
          grep -q 'AdaptivePlaybackController' source-repo/BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'PlaybackDiagnostics' source-repo/BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'تشخيص التشغيل المتقدم' source-repo/BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SettingsActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Gradle wrapper
        working-directory: source-repo/BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests
        working-directory: source-repo/BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon testDebugUnitTest -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build release APK
        working-directory: source-repo/BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="source-repo/BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -v -keystore /tmp/blofy-final.jks -storepass blofyfinal332 -keypass blofyfinal332 -alias blofy-final -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=BLOFY PLAYER FINAL, O=BLOFY, C=SA'
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" /tmp/BLOFY-PLAYER-FINAL-v332-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/blofy-final.jks --ks-pass pass:blofyfinal332 --key-pass pass:blofyfinal332 --ks-key-alias blofy-final --out BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk /tmp/BLOFY-PLAYER-FINAL-v332-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk
          sha256sum BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk > BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-FINAL-v332-TEST-SIGNED
          path: |
            BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk
            BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk.sha256
          if-no-files-found: error

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v332-final-test"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title 'BLOFY PLAYER FINAL v332 TEST' --notes 'Signed v332 test build from BLOFY-PLAYER-FINAL.' --prerelease BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk BLOFY-PLAYER-FINAL-v332-TEST-SIGNED.apk.sha256
